<header class="site-header">
  <div class="container header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Visal So, home">
      {% assign brand_asset = site.static_files | where: 'path', site.brand_image | first %}
      <img class="site-brand__image"
           src="{% if brand_asset %}{{ site.brand_image | relative_url }}{% else %}{{ site.portrait | relative_url }}{% endif %}"
           alt="" width="42" height="42" decoding="async">
      <span>{{ site.title | escape }}</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for item in site.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.nav == item.id %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
      {% endfor %}
    </nav>
    <button class="theme-toggle"
            type="button"
            data-theme-toggle
            hidden
            aria-label="Switch to light theme">
    
      <svg width="32" height="24" viewBox="0 0 32 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.8"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true"
           focusable="false">
    
        <path d="M1 16H6 M26 16H31" />
        <circle cx="8" cy="16" r="2" />
        <circle cx="24" cy="16" r="2" />
    
        <path data-switch-lever d="M10 16L22 6" />
      </svg>
    
      <span data-theme-label>Light</span>
    </button>
  </div>
</header>
