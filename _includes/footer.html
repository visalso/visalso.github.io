<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <a class="footer-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <p>Experimental quantum physics · {{ site.affiliation | escape }}</p>
      <p class="footer-copyright">© {{ site.time | date: '%Y' }} {{ site.title | escape }}</p>
    </div>
    <nav class="footer-links" aria-label="Professional profiles">
      <a href="mailto:{{ site.email | escape }}">Email</a>
      {% for item in site.social_links %}
      <a href="{{ item.url | escape }}">{{ item.title | escape }}</a>
      {% endfor %}
    </nav>
  </div>
</footer>
