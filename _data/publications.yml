  abstract: >-
    We study energy-transfer processes in an open quantum system whose excitations
    can spread over several interacting sites. A long-range Frenkel-exciton model
    is coupled to a damped collective vibrational mode to represent donor and acceptor
    structures analogous to molecular light-harvesting systems. Certain delocalized
    excitonic states yield particularly high transport rates while retaining entanglement
    during dissipative transfer. The analysis explores the effects of static disorder,
    noise, temperature, and the number and arrangement of molecular subunits. A
    proposed trapped-ion realization provides a path to testing these transport
    mechanisms in parameter regimes that are difficult to model classically.
