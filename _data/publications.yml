  abstract: >-
    We develop and benchmark a segmented, monolithic three-dimensional Paul trap
    fabricated in fused silica. The design aims to combine robust confinement and
    low motional heating with strong optical access and the precision of microfabricated
    structures. Characterization with ytterbium ions demonstrates uniform axial
    trapping over a broad region, optical access approaching a numerical aperture
    of 0.7, and a radial heating rate near 1.1 quanta per second at roughly 3 MHz.
    Radial motional Ramsey coherence is approximately 95 ms. The trap also supports
    preparation of a two-ion Bell state with high measured parity contrast, indicating
    its potential for modular quantum-information experiments.
