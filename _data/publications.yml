  abstract: >-
    We present a blueprint for simulating polarons, excitations dressed by lattice
    vibrations, in a programmable trapped-ion device. Spin-phonon interactions can
    reproduce both short-range Holstein-type and longer-range Fröhlich-type couplings.
    To identify strongly dressed quasiparticles, the proposed measurements use displaced
    Green functions to extract energy bands, binding effects, and vibrational sidebands.
    Spatial measurements and ancilla-assisted correlation probes then reveal how
    phonon dressing builds around an excitation and evolves in time. The proposal
    connects quasiparticle spectra to their microscopic spatial structure across
    different interaction ranges.
