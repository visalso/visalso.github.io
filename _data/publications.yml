  venue: arXiv:2610.18970
  type: preprint
  thumbnail: /assets/polaron.png
  selected: false
  links:
    - label: arXiv
      url: https://arxiv.org/abs/2610.18970

  abstract: >-
    Strong coupling between mobile charge carriers or excitons and lattice vibrations gives
    rise to polarons: quasiparticles formed by charge carriers dressed by a cloud of phonon
    excitations. Polaron formation determines transport properties of systems ranging from transition-metal
    oxides and organic semiconductors to light-harvesting complexes. In excitonic systems that
    admit a hard-core boson description, mapping the excitations to pseudospins provides a natural
    framework for studying polaron physics, including the nonperturbative regime in which hopping
    amplitudes, phonon energies, and coupling strengths are comparable. Here, we propose a trapped-ion
    blueprint for realizing spin-phonon Hamiltonians with programmable spatial coupling between
    excitation density and phonon displacements, encompassing local Holstein and long-range
    Fröhlich-type interactions. To access strongly dressed quasiparticles whose bare spectral
    weight is suppressed, we introduce displaced Green's functions implemented through spin-dependent
    phonon displacements. Their spectral response reveals the polaron band spectrum, including
    binding energies and phonon-excitation sidebands, while spatially resolved measurements
    probe the structure of the phonon dressing cloud, providing a route to polaron tomography.
    We further complement this spectroscopy with direct and ancilla-assisted measurements of
    spin-phonon correlations that track the coupled dynamics of the excitation and its environment.
    These approaches connect the emergent quasiparticle spectrum to the microscopic buildup
    of its dressing cloud, enabling controlled studies of how the spatial range of coupling
    shapes polaron formation and mobility.
