  abstract: >-
    We propose dissipative control protocols in trapped-ion simulators that use
    electron-transfer-inspired spin-boson interactions to stabilize entangled states.
    Controlled phonon displacements and sympathetic-cooling-induced damping let
    a target system relax toward engineered spin and boson steady states. Analytical
    arguments clarify the underlying dynamics, and realistic parameter choices support
    protocols for multipartite W states of qubits or bosonic modes. The approach
    also extends to Dicke states with adjustable excitation number. We discuss how
    experimental imperfections and noise could affect an implementation in current
    ion-trap platforms.
