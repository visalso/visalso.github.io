- id: dissipation-entanglement
  title: Dissipation-assisted steady-state entanglement engineering based on electron 
    transfer models
  short_title: Dissipation-assisted entanglement
  summary: Exploring steady-state entanglement engineering through electron transfer 
    models and dissipation.
  category: Quantum control
