  abstract: >-
    We experimentally simulate molecular charge and exciton transfer using a trapped-ion
    realization of a two-mode linear vibronic-coupling model. Controllable spin-phonon
    interactions represent electronic and vibrational degrees of freedom, while
    engineered reservoirs supply dissipation for both vibrational modes. By tuning
    the coupling strengths, the simulator crosses between charge-transfer and vibrationally
    assisted exciton-transfer regimes. Degenerate vibrational modes can enhance
    transfer at large energy differences, whereas nondegenerate modes enable additional
    slower pathways that change the dependence on the donor-acceptor energy gap.
    These results illustrate how even one extra vibration modifies interference
    among transport channels in an open quantum system.
