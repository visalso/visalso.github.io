  abstract: >-
    Monolithic three-dimensional (3D) Paul traps combine the high-precision microfabrication
    of two-dimensional (2D) chip traps with the deep trapping potentials and low heating rates
    characteristic of macroscopic Paul traps, which are typically manually assembled. However,
    achieving low motional heating rates and optical access with a high numerical aperture (NA)
    while maintaining the high radio-frequency (RF) voltages required for heavy ionic species,
    such as Yb$^{+}$ and Ba$^{+}$, remains a significant technical challenge. In this work,
    we present a segmented, monolithic 3D fused silica blade trap, featuring an ion-electrode
    distance of 250 $μ$m with stable operation at high RF voltages. We benchmark the performance
    of the trap using Yb$^{+}$ ions, demonstrating axially homogeneous trapping potentials for
    200 $μ$m around the axial center of the trap, high multi-directional optical access (up
    to 0.7 NA), and radial motional heating rate as low as 1.1 $\pm$ 0.1 quanta/s at radial
    trap frequencies about 3 MHz near room temperature. Furthermore, we observe a motional Ramsey
    coherence time, $T_{2}$, of around 95 ms for the radial center-of-mass mode. We demonstrate
    a two-qubit gate fidelity of ${99.3}^{+ 0.7}_{- 1.5}$$\%$ with state preparation and measurement
    correction. These results establish fused-silica monolithic blade traps as a scalable, modular
    platform for quantum simulation, computation, metrology, and networking with heavy ionic
    species.
