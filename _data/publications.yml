  abstract: >-
    Trapped atomic ions are among the most advanced platforms for quantum simulation, computation,
    and metrology, offering long coherence times and precise, individual control over both internal
    and motional degrees of freedom. In this review, we present a pedagogical introduction to
    trapped-ion systems, covering the physics of ion trapping, qubit encodings, and laser-ion
    interactions. We explain how spin-dependent forces generated by light fields enable both
    analog and digital quantum simulations of spin and spin-boson models, as well as high-fidelity
    quantum logic gates. We then highlight an emerging frontier in the simulation of chemical
    dynamics, summarizing recent experiments that demonstrate the capability of trapped ions
    to simulate vibronic models and excitation-transfer processes. Finally, we outline future
    directions in quantum simulation and discuss open challenges in scaling up trapped-ion architectures.
