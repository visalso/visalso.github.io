- id: programmable-polarons
  title: Programmable polaron models and tomography in trapped-ion quantum simulators
  short_title: Programmable polaron models
  summary: Polaron models and tomography in a trapped-ion quantum simulator.
  category: Quantum simulation
  authors:
    - F. Marijanovic
    - U. Bhattacharya
    - A. Menon
    - V. So
    - G. Pagano
    - E. Demler
  year: 2026
