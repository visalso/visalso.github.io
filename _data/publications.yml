  abstract: >-
    We demonstrate a way to engineer thermal environments for the vibrational modes
    of trapped ions while varying bath temperature and damping strength independently.
    The technique prepares bosonic thermal states and enables controlled studies
    of dissipative spin-boson dynamics at finite temperature. In an electron-transfer
    model, we observe how increasing the bath temperature broadens the transfer-rate
    spectrum, suppressing transfer near small energy offsets while promoting it
    at larger gaps. We then extend the approach to exciton transport assisted by
    two vibrational modes and identify additional transfer pathways activated by
    temperature and interference.
