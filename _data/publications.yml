  note: “Quantum Computers and Simulators with Atoms” · Varenna, July 2024 · 
    arXiv:2505.20412
  links:
    - label: arXiv
      url: https://arxiv.org/abs/2505.20412
  abstract: >-
    This pedagogical review introduces trapped-ion quantum technology, beginning
    with confinement in radio-frequency traps, qubit encodings, and coherent laser-ion
    interactions. It describes how spin-dependent optical forces enable high-quality
    quantum gates and analog or digital simulations of interacting spins and coupled
    spin-boson systems. The discussion then turns to chemical dynamics, explaining
    how vibrational and electronic degrees of freedom can be emulated with trapped
    ions to explore excitation and charge transfer. The authors conclude with research
    directions and engineering challenges for larger, more capable ion-based quantum
    simulators.
