  abstract: >-
    Electron transfer is at the heart of many fundamental physical, chemical, and biochemical
    processes essential for life. The exact simulation of these reactions is often hindered
    by the large number of degrees of freedom and by the essential role of quantum effects.
    Here, we experimentally simulate a paradigmatic model of molecular electron transfer using
    a multispecies trapped-ion crystal, where the donor-acceptor gap, the electronic and vibronic
    couplings, and the bath relaxation dynamics can all be controlled independently. By manipulating
    both the ground-state and optical qubits, we observe the real-time dynamics of the spin
    excitation, measuring the transfer rate in several regimes of adiabaticity and relaxation
    dynamics. Our results provide a testing ground for increasingly rich models of molecular
    excitation transfer processes that are relevant for molecular electronics and light-harvesting
    systems.
