- id: correlated-pair-creation
  title: Correlated pair creation with positive- and negative-frequency oscillators in a 
    trapped-ion quantum simulator
  short_title: Correlated pair creation
  summary: Investigating correlated pair creation with positive- and negative-frequency 
    oscillators.
  category: Quantum simulation
  authors:
    - V. So
    - M. Zhu
    - H. Pu
    - G. Pagano
  year: 2026
  sort_date: "2026-10-08"
  venue: arXiv:2610.12579
  type: preprint
  thumbnail: /assets/paircreation.png
  selected: false
  links:
    - label: arXiv
      url: https://arxiv.org/abs/2610.12579

  abstract: >-
    Spin-dependent forces enable independent control over the effective frequencies of bosonic
    motional modes and their coupling strengths to spins in trapped-ion spin-boson quantum simulators.
    We show that the relative signs of these effective frequencies provide an important programmable
    resource for engineering distinct multimode dynamics. Focusing on a two-mode quantum Rabi
    model, changing the frequencies of the two modes from the same sign to opposite signs reorganizes
    the resonance structure of the spin-mediated bosonic interaction, converting the dominant
    resonant process from excitation exchange to correlated pair creation. In the dispersive
    regime, the resulting effective interaction realizes a two-mode parametric amplifier with
    stable oscillatory, critical, and exponentially amplifying regimes separated by a spin-dependent
    instability threshold. Across these regimes, the dynamics generate collective-quadrature
    squeezing and bipartite motional entanglement. Preparing the spin in a coherent superposition
    further allows different spin components to experience distinct stability regimes, generating
    tripartite spin-boson entanglement, while spin postselection can coherently combine the
    conditional bosonic branches to generate non-Gaussian entangled bosonic states. Finally,
    we outline an implementation using parameters within reach of current trapped-ion platforms.
