- id: trapped-ion-fundamentals
  title: Fundamentals of trapped ions and quantum simulation of chemical 
    dynamics
  short_title: Fundamentals of trapped-ion simulation
  summary: An introduction to trapped ions and their use in simulating 
    chemical dynamics.
  category: Book chapters and proceedings
  authors:
    - G. Pagano
    - W. Adamczyk
    - V. So
  year: 2025
  venue: Proceedings of the International School of Physics “Enrico Fermi”, 
    Course 214
  type: proceedings
