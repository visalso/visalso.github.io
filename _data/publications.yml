- id: correlated-pair-creation
  title: Correlated pair creation with positive- and negative-frequency 
    oscillators in a trapped-ion quantum simulator
  short_title: Correlated pair creation
  summary: Investigating correlated pair creation with positive- and 
    negative-frequency oscillators.
  category: Quantum simulation
  authors:
    - V. So
    - M. Zhu
    - H. Pu
    - G. Pagano
  year: 2026
  venue: arXiv:2610.12579
  type: preprint
  selected: false
  links:
    - label: arXiv
      url: https://arxiv.org/abs/2610.12579

  abstract: >-
    We investigate how reversing the effective frequency sign of one motional mode
    changes the dynamics of a two-mode spin-boson simulator. With frequencies of
    equal sign, resonant processes exchange excitations between modes; opposite
    signs instead favor the correlated generation of pairs. In a dispersive regime,
    this becomes a two-mode parametric-amplification problem with oscillatory, critical,
    and unstable amplification regions. The resulting evolution produces quadrature
    squeezing and motional entanglement. Coherent preparation and postselection
    of the spin can additionally yield multipartite entanglement and non-Gaussian
    bosonic states, using parameters compatible with trapped-ion experiments.
