  abstract: >-
    We realize a controllable model of molecular electron transfer with a crystal
    containing two ionic species. One set of ion states represents donor and acceptor
    electronic configurations, collective vibrations represent molecular motion,
    and sympathetic cooling creates an adjustable dissipative environment. The experiment
    independently varies energy offsets, vibronic interactions, electronic coupling,
    and relaxation strength. By tracking the electronic population over time, we
    measure transfer dynamics and reaction rates in several regimes, providing a
    test platform for quantum models of energy conversion and excitation transport
    relevant to molecular and light-harvesting materials.
