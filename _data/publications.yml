  abstract: >-
    We use precision spectroscopy and time-resolved measurements to characterize
    a high-lying excited state of singly ionized ytterbium-172. Excitation from
    metastable states reveals an unexpectedly long lifetime of 37.9(9) microseconds,
    sufficient to resolve coherent Rabi oscillations and motional sidebands. Combining
    coherent population control, state-selective detection, heralding, and optical
    pumping, we determine the decay fractions to three lower states and constrain
    additional decay channels. We also measure a Landé g-factor and improve the
    precision of a related metastable-state branching ratio. The results supply
    spectroscopic benchmarks relevant to ytterbium-based quantum-control protocols.
